# Netlify builds the wall from this repo and runs netlify/functions (agents and the filer heartbeat).
# Site configuration > Environment variables: VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY, VITE_PIVOT_LOG_URL,
# VITE_VISITOR_PIN, and for the agents SUPABASE_SERVICE_KEY, ANTHROPIC_API_KEY, AGENT_TICK_KEY, HEARTBEAT_KEY.
# The Pivot Log copy (pivot-sync): PIVOT_LOG_SUPABASE_URL, PIVOT_LOG_ANON_KEY, PIVOT_LOG_SYNC_EMAIL, PIVOT_LOG_SYNC_PASSWORD.
[build]
  command = "npm ci && npm run build"
  publish = "dist"
  # Skip the build (no production deploy, no deploy credits) when a push changes nothing the site or its
  # functions use: collectors, tests, the hub schema, farm_mcp, workflows and docs run elsewhere.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- src public data netlify index.html package.json package-lock.json vite.config.ts tsconfig.json netlify.toml"
[build.environment]
  NODE_VERSION = "22"
