# The collectors that feed the wall. Each records its run in cc.feed_run, so a job that stops
# running shows up on the wall's feed footer (and as an alert at twice its schedule).
# Every job can also be run by hand from the Actions tab ("Run workflow").
# Needs repository secrets (Settings > Secrets and variables > Actions):
#   SUPABASE_PROJECT_REF   the farm hub project (not Pivot Log's)
#   SUPABASE_SERVICE_KEY   farm hub > Project Settings > API Keys > secret key
#   GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, GOOGLE_REFRESH_TOKEN
#                          an OAuth client with read-only Drive and Calendar scopes (see README)
#   DEERE_CLIENT_ID, DEERE_CLIENT_SECRET
#                          the Deere developer app (README, Deere); the job skips itself until they exist
name: Collectors
on:
  schedule:
    - cron: '*/15 * * * *'  # Google: calendar, Deere CSV, filer logs
    - cron: '7 * * * *'     # hourly: NWS forecast, news
    - cron: '0 9 * * 1'     # Monday 4-5 am: Field Master (also on every change to the CSV)
    - cron: '40 */2 * * *'  # every 2 hours: Deere Ops Center
    - cron: '20,50 * * * *' # every 30 min: the harvest workbooks (read only when one changed)
  push:
    branches: [main]
    paths: [data/field_master_2026.csv]
  workflow_dispatch:
    inputs:
      job:
        description: 'Which collector'
        type: choice
        options: [all, google, nws, news, field-master, deere, harvest]
        default: all
env:
  SUPABASE_URL: https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co
  SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
jobs:
  google:
    if: github.event.schedule == '*/15 * * * *' || inputs.job == 'all' || inputs.job == 'google'
    runs-on: ubuntu-latest
    env:
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: |
          # Until the Google secrets are added (setup Part 3b), skip instead of failing every 15 minutes.
          if [ -z "$GOOGLE_REFRESH_TOKEN" ]; then echo "::notice::Google feeds not set up yet (GOOGLE_* secrets missing); skipped."; exit 0; fi
          python3 collectors/google_feeds.py
  nws:
    if: github.event.schedule == '7 * * * *' || inputs.job == 'all' || inputs.job == 'nws'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python3 collectors/nws.py
  news:
    if: github.event.schedule == '7 * * * *' || inputs.job == 'all' || inputs.job == 'news'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python3 collectors/news.py
  field-master:
    if: github.event_name == 'push' || github.event.schedule == '0 9 * * 1' || inputs.job == 'all' || inputs.job == 'field-master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python3 collectors/field_master.py
  deere:
    if: github.event.schedule == '40 */2 * * *' || inputs.job == 'all' || inputs.job == 'deere'
    runs-on: ubuntu-latest
    env:
      DEERE_CLIENT_ID: ${{ secrets.DEERE_CLIENT_ID }}
      DEERE_CLIENT_SECRET: ${{ secrets.DEERE_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python3 collectors/deere.py
  harvest:
    if: github.event.schedule == '20,50 * * * *' || inputs.job == 'all' || inputs.job == 'harvest'
    runs-on: ubuntu-latest
    env:
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      # A cheap look at Drive first; LibreOffice (to recalculate the workbooks) is only installed when a workbook changed.
      - id: check
        run: |
          if [ -z "$GOOGLE_REFRESH_TOKEN" ]; then echo "::notice::Google feeds not set up yet (GOOGLE_* secrets missing); skipped."; echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          python3 collectors/harvest_workbooks.py --check
      - if: steps.check.outputs.changed == 'true'
        run: |
          pip install openpyxl
          command -v soffice || (sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libreoffice-calc)
          python3 collectors/harvest_workbooks.py
