# Applies supabase/cc_hub.sql (the `cc` schema) to the farm hub's Supabase project.
# The file is idempotent, so it runs on every change and can be re-run by hand from the Actions tab.
# One idempotent file applied with psql keeps this simple: no migration history to manage.
# Needs a repository secret (Settings > Secrets and variables > Actions):
#   SUPABASE_DB_URL   farm hub > Connect > Session pooler connection string, with the database password
name: Hub schema
on:
  push:
    branches: [main]
    paths: [supabase/cc_hub.sql]
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y postgresql-client
      - env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/cc_hub.sql
